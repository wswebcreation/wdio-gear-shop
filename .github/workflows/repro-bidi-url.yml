# Repro webdriverio/webdriverio#15481 against this gear shop (cheap local static page).
# Goal: compare Linux CI vs macOS CI with the same script the issue uses.
name: Repro BiDi url() vs classic navigateTo

on:
  workflow_dispatch:
    inputs:
      runs:
        description: How many times to run the repro script
        required: false
        default: '5'
      n:
        description: Iterations per script run (N)
        required: false
        default: '10'
      also_live:
        description: Also run once against https://webdriver.io
        type: boolean
        required: false
        default: true
  push:
    paths:
      - '.github/workflows/repro-bidi-url.yml'
      - 'scripts/repro-url-bidi.mjs'

jobs:
  repro:
    name: ${{ matrix.os }} · gear shop localhost
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install site + webdriverio
        run: |
          npm ci
          npm install --no-save webdriverio@latest

      # Do not use browser-actions/setup-chrome here:
      # - its "stable" ChromeDriver can mismatch Chrome major
      # - its macOS Chrome binary hangs chromedriver session create
      # WDIO downloads a matched Chrome-for-Testing + ChromeDriver pair.

      - name: Start gear shop
        run: |
          npm start &
          echo $! > /tmp/webshop.pid
          for i in $(seq 1 30); do
            if curl -sf "http://127.0.0.1:4173/index.html" >/dev/null; then
              echo "shop up"
              exit 0
            fi
            sleep 1
          done
          echo "shop failed to start"
          exit 1

      - name: Run repro against localhost gear shop
        env:
          BENCH_URL: http://127.0.0.1:4173/index.html
          N: ${{ inputs.n || '10' }}
        run: |
          RUNS='${{ inputs.runs || 5 }}'
          echo "os=${{ matrix.os }} runs=$RUNS N=$N URL=$BENCH_URL"
          failed=0
          for i in $(seq 1 "$RUNS"); do
            echo "=== localhost run $i / $RUNS ==="
            if ! node scripts/repro-url-bidi.mjs; then
              echo "RUN $i FAILED"
              failed=1
            fi
          done
          exit "$failed"

      - name: Run repro against https://webdriver.io
        if: ${{ github.event_name == 'push' || inputs.also_live }}
        env:
          BENCH_URL: https://webdriver.io/
          N: ${{ inputs.n || '10' }}
        run: |
          echo "=== live webdriver.io (1 run) ==="
          node scripts/repro-url-bidi.mjs

      - name: Stop gear shop
        if: always()
        run: |
          if [ -f /tmp/webshop.pid ]; then
            kill "$(cat /tmp/webshop.pid)" || true
          fi
          pkill -f 'Google Chrome' || true
          pkill -f 'chrome-headless' || true
          pkill -f chromedriver || true
